name: release

# Tag-driven. `v0.4.0` produces a release whose assets are exactly what
# `scripts/install.sh --from-release` downloads, so the install path a user takes
# is the artifact CI tested.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    # darwin-arm64 only for v0.4. The matrix would be trivial to extend, but an
    # untested platform in a release is worse than an absent one.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: install dependencies
        working-directory: packages/opencode
        run: bun install --frozen-lockfile
        continue-on-error: true

      - name: typecheck
        working-directory: packages/opencode
        run: bun run typecheck

      - name: test
        working-directory: packages/opencode
        run: bun test test/freecode

      # The binary is built and then *smoke tested by running it*. A build that
      # exits zero but produces a binary that cannot start is the failure this
      # step exists to catch, and it is a real historical failure mode for
      # Bun-compiled OpenCode binaries.
      - name: build the binary
        working-directory: packages/opencode
        run: bun run package

      - name: verify the binary starts and names itself
        run: |
          BIN=packages/opencode/dist/freecode-darwin-arm64/bin/freecode
          test -x "$BIN"
          VERSION="$("$BIN" --version)"
          echo "version: $VERSION"
          case "$VERSION" in
            "$(node -p 'require("./packages/opencode/package.json").version')"*) ;;
            *) echo "version mismatch: $VERSION"; exit 1 ;;
          esac
          # `--help` writes to stderr, so both streams are captured.
          HELP="$("$BIN" --help 2>&1)"
          case "$HELP" in
            *freecode*) ;;
            *) echo "help output does not name freecode"; exit 1 ;;
          esac

      # The end-to-end check that matters: install into a clean prefix with no
      # FreeCode environment, then run a command from an arbitrary project
      # directory. Laya is skipped deliberately — the point is that FreeCode works
      # without it.
      - name: install into a clean prefix and run from another directory
        run: |
          set -euo pipefail
          PREFIX="$(mktemp -d)"
          mkdir -p "$PREFIX/project"
          (
            cd "$PREFIX/project"
            git init -q
            git config user.email ci@freecode.local
            git config user.name CI
            echo "def f(): pass" > a.py
            git add -A && git commit -qm init
          )

          FREECODE_INSTALL_DIR="$PREFIX/bin" \
          FREECODE_HOME="$PREFIX/home" \
          XDG_DATA_HOME="$PREFIX/data" \
          XDG_CONFIG_HOME="$PREFIX/config" \
          FREECODE_SKIP_LAYA=1 \
            ./scripts/install.sh

          export FREECODE_HOME="$PREFIX/home"
          export XDG_DATA_HOME="$PREFIX/data"
          export XDG_CONFIG_HOME="$PREFIX/config"
          export PATH="$PREFIX/bin:$PATH"

          cd "$PREFIX/project"
          freecode --version

          # No pool is configured, so `doctor` must report exactly that and exit
          # non-zero — the check that a real misconfiguration is caught rather
          # than passed over.
          if freecode doctor; then
            echo "doctor passed with no pool configured; it should have failed"
            exit 1
          fi
          echo "doctor correctly reported the missing pool"

      - name: build the release archive
        run: ./scripts/release.sh

      - name: verify the archive installs and runs
        run: |
          set -euo pipefail
          # Serve the archive locally so the release path in install.sh is
          # exercised without needing a published release.
          ARCHIVE_DIR="$PWD/dist/release"
          PORT=8791
          (cd "$ARCHIVE_DIR" && python3 -m http.server "$PORT" >/dev/null 2>&1) &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          sleep 1

          PREFIX="$(mktemp -d)"
          # install.sh builds GitHub URLs, so the release branch of the download is
          # checked here by fetching and verifying the checksum by hand, then
          # installing from the unpacked tree.
          curl -fsSL "http://127.0.0.1:$PORT/freecode-darwin-arm64.tar.gz" -o "$PREFIX/archive.tar.gz"
          curl -fsSL "http://127.0.0.1:$PORT/SHA256SUMS" -o "$PREFIX/SHA256SUMS"

          EXPECTED="$(awk '{print $1}' "$PREFIX/SHA256SUMS")"
          ACTUAL="$(shasum -a 256 "$PREFIX/archive.tar.gz" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL" || { echo "checksum mismatch"; exit 1; }
          echo "checksum verified: $ACTUAL"

          tar -xzf "$PREFIX/archive.tar.gz" -C "$PREFIX"
          test -x "$PREFIX/freecode-darwin-arm64/bin/freecode"
          test -f "$PREFIX/freecode-darwin-arm64/bridge/main.py"
          "$PREFIX/freecode-darwin-arm64/bin/freecode" --version

      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/release/freecode-darwin-arm64.tar.gz
            dist/release/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh \
              | bash -s -- --from-release
            ```

            Requires macOS on Apple Silicon. FreeCode routes on rules without Laya;
            run `freecode doctor` after installing to see what your environment has.
