# FreeCode trunk CI.
#
# Runs on every push to the default branch and every PR. The five stages
# mirror `scripts/ci/ci.sh` so a developer running the script locally sees
# the same result as CI:
#
#   build        install + compile
#   typecheck    tsgo
#   regression   baseline test set, fail count at or under the recorded baseline
#   vanilla      retained-mechanics smoke (the minimal-intrusion promise, resident)
#   secret-scan  no plaintext key in a credential or config sample
#
# The `regression`, `vanilla`, and `secret-scan` jobs run independently so
# a failure in one localizes to itself; `build` runs first and its artifact
# is shared. The whole trunk run is expected to finish well under the 30-minute
# "merge to installable" budget, leaving time for the tag-driven release
# workflow (`release.yml`) that follows a green trunk.

name: freecode-ci

on:
  push:
    branches:
      - freecode-main
  pull_request:
    branches:
      - freecode-main
  workflow_dispatch:

concurrency:
  group: freecode-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the whole chain in one job. Keeping build + typecheck + regression
  # in one job means the "trunk is buildable and testable" signal is a
  # single check; a PR that breaks the build fails exactly one named job.
  trunk:
    name: build + typecheck + regression
    runs-on: macos-14
    defaults:
      run:
        working-directory: packages/opencode
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # regression's baseline comparison wants history

      - uses: ./.github/actions/setup-bun

      - name: install dependencies
        run: bun install --frozen-lockfile
        continue-on-error: true

      - name: typecheck
        run: bun run typecheck

      - name: build the binary
        run: bun run package

      - name: regression (config + provider + freecode)
        # `--continue` runs every test even when some fail; the gate is the
        # fail *count* at or under the recorded baseline (5 fails that match
        # the upstream baseline, not a FreeCode regression), not a hard zero.
        run: |
          set -uo pipefail
          log=/tmp/freecode-ci-regression.log
          bun test test/config test/provider test/freecode --continue 2>&1 | tee "$log" || true
          if [[ ! -s "$log" ]]; then
            echo "regression FAILED: no test output"
            exit 1
          fi
          fails="$(grep -Eo '[0-9]+ fail' "$log" | awk '{print $1}' | sort -n | tail -1)"
          fails="${fails:-0}"
          echo "regression fails: $fails (baseline 5)"
          if (( fails > 5 )); then
            echo "regression FAILED: $fails fails exceed the baseline of 5"
            grep -B2 -A8 'fail' "$log" | tail -60 || true
            exit 1
          fi
          echo "regression ok"

  # The retained-mechanics guarantee: a fresh build still passes the
  # OpenCode-owned test directories and still starts as a usable CLI with no
  # FreeCode pool configured. Runs against the trunk build, not the tag
  # release, so the promise is verified on every commit, not only at RC time.
  vanilla:
    name: vanilla smoke (retained mechanics)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: run the vanilla smoke
        run: bash scripts/ci/vanilla-smoke.sh

  # No plaintext key in a sample or config template. Offline and
  # deterministic: a bounded file list plus a key-pattern table, so any
  # runner can reproduce the result.
  secret-scan:
    name: credential sample scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: scan the sample and template surface
        run: bash scripts/ci/secret-scan.sh
